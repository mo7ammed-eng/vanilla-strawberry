name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -e
          test -n "$VPS_SSH_KEY_B64"
          test -n "$VPS_KNOWN_HOSTS"

          mkdir -p ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | base64 --decode > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -y -f "$RUNNER_TEMP/deploy_key" > /dev/null

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -e

          ssh \
            -i "$RUNNER_TEMP/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'

          set -Eeuo pipefail

          export PATH="$HOME/.nvm/versions/node/v24.22.3/bin:$PATH"

          cd /var/www/vanilla-strawberry

          echo "================================"
          echo "Starting production deployment"
          echo "================================"

          echo "Updating source..."
          git fetch origin main
          git reset --hard origin/main

          echo "Installing frontend dependencies..."
          npm ci

          echo "Installing Laravel dependencies..."
          cd api
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

          echo "Refreshing Laravel cache..."
          php8.4 artisan optimize:clear
          php8.4 artisan config:cache

          cd ..

          echo "Building Next.js..."
          NODE_OPTIONS=--max-old-space-size=2048 npm run build

          echo "Restarting PM2..."
          pm2 restart vanilla-strawberry-web --update-env
          pm2 save

          echo "Waiting for Next.js to become ready..."

          READY=0

          for i in {1..30}; do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/ -o /dev/null; then
              READY=1
              echo "Next.js is responding successfully."
              break
            fi

            echo "Waiting for Next.js... ($i/30)"
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "================================"
            echo "DEPLOYMENT HEALTH CHECK FAILED"
            echo "================================"

            echo "PM2 status:"
            pm2 status

            echo "PM2 logs:"
            pm2 logs vanilla-strawberry-web --lines 80 --nostream || true

            exit 1
          fi

          echo "================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "================================"

          REMOTE
